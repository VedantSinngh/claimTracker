# NOTE ON LOCATION
# GitHub Actions only discovers workflows in <repo-root>/.github/workflows/.
# This repository's root is one level above the project, so every path below
# is prefixed with `claimtracker/`. If the project is ever hoisted to the
# repository root, drop that prefix throughout.
name: ClaimTracker CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── What exists in this commit? ───────────────────────────────────
  # The frontend lands in Phase 7. Until then its job must not fail the
  # build; once `frontend/package.json` is committed, this flips to true
  # and the lint/type-check/test job starts running with no edit here.
  detect:
    name: Detect project parts
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f claimtracker/frontend/package.json ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "Frontend detected — its job will run."
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/package.json yet — skipping the frontend job."
          fi

  # ── Backend ──────────────────────────────────────────────────────
  backend-lint-test:
    name: Backend — Lint + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claimtracker/backend

    # Real Postgres for the analytics SQL tests (DATE_TRUNC, FILTER,
    # RANK() OVER, CTEs). POSTGRES_TEST_URL makes the fixtures use this
    # service instead of reaching for Docker/testcontainers.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: claimtracker_test
          POSTGRES_USER: claimuser
          POSTGRES_PASSWORD: claimpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claimuser -d claimtracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: test-secret-key-for-ci
      GROQ_API_KEY: test-groq-key
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      POSTGRES_TEST_URL: postgresql+asyncpg://claimuser:claimpass@localhost:5432/claimtracker_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            claimtracker/backend/requirements.txt
            claimtracker/backend/requirements-dev.txt

      - name: Install system deps (tesseract + poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Python deps
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check app/ tests/

      - name: Generate sample PDFs
        # The committed PDFs are regenerated so the pipeline tests fail loudly
        # if the generator and the committed fixtures ever drift apart.
        working-directory: claimtracker
        run: python samples/create_sample_pdfs.py

      - name: Run migrations against Postgres
        # Proves the Alembic chain (including the 0004 roles data migration)
        # applies and reverses cleanly on a real database.
        env:
          DATABASE_URL: postgresql+asyncpg://claimuser:claimpass@localhost:5432/claimtracker_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run pytest
        run: pytest -v

      - name: Enforce coverage gate (services + validators ≥ 80%)
        run: |
          coverage report \
            --include="app/services/*,app/validators/*" \
            --fail-under=80 \
            --show-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./claimtracker/backend/coverage.xml
        continue-on-error: true

  # ── Frontend (Phase 7 onwards) ───────────────────────────────────
  frontend-lint:
    name: Frontend — Lint + Type Check + Test
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: claimtracker/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: claimtracker/frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Jest unit tests
        run: npm test -- --ci

  # ── Docker build ─────────────────────────────────────────────────
  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [detect, backend-lint-test, frontend-lint]
    # `always()` so a skipped frontend job does not cancel this one; the
    # backend must still have passed.
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.backend-lint-test.result == 'success' &&
      (needs.frontend-lint.result == 'success' || needs.frontend-lint.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t claimtracker-backend:${{ github.sha }} ./claimtracker/backend

      - name: Build frontend image
        if: needs.detect.outputs.frontend == 'true'
        run: docker build -t claimtracker-frontend:${{ github.sha }} ./claimtracker/frontend
