name: ClaimTracker CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ──────────────────────────────────────────────────────
  backend-lint-test:
    name: Backend — Lint + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (tesseract + poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Python deps
        run: pip install -r requirements.txt ruff

      - name: Lint with ruff
        run: ruff check app/ tests/

      - name: Copy .env.example → .env
        run: cp ../.env.example .env
        # Set test values so pydantic-settings doesn't error
      - name: Override env for tests
        run: |
          echo "SECRET_KEY=test-secret-key-for-ci" >> .env
          echo "GROQ_API_KEY=test-groq-key" >> .env
          echo "DATABASE_URL=sqlite+aiosqlite:///:memory:" >> .env

      - name: Run pytest with coverage
        run: pytest --cov=app --cov-report=xml -v
        env:
          SECRET_KEY: test-secret-key-for-ci
          GROQ_API_KEY: test-groq-key
          DATABASE_URL: sqlite+aiosqlite:///:memory:

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
        continue-on-error: true

  # ── Frontend ─────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — Lint + Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  # ── Docker build ─────────────────────────────────────────────────
  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t claimtracker-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t claimtracker-frontend:${{ github.sha }} ./frontend
