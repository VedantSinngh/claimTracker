[pytest]
asyncio_mode = auto
testpaths = tests

# Coverage sources and omissions live in .coveragerc.
# No --cov-fail-under here on purpose: the enforced 80% gate is scoped to
# app/services + app/validators and runs as its own step, locally and in CI:
#
#   coverage report --include="app/services/*,app/validators/*" --fail-under=80
#
addopts = --cov --cov-report=term-missing --cov-report=xml

markers =
    postgres: needs a live PostgreSQL (testcontainers, or POSTGRES_TEST_URL in CI)
